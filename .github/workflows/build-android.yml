name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Default Backend API URL (optional)'
        required: false
        default: 'https://biolens-backend.onrender.com'

jobs:
  build:
    name: Build BioLens Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Build Web Application
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ github.event.inputs.api_url || 'https://biolens-backend.onrender.com' }}
        run: |
          npm run build

      - name: Sync Capacitor Android
        working-directory: ./frontend
        run: |
          npx cap sync android

      - name: Make Gradle Executable
        working-directory: ./frontend/android
        run: |
          chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./frontend/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Exists
        run: |
          ls -la frontend/android/app/build/outputs/apk/debug/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioLens-v1.0-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Add Step Summary
        run: |
          echo "## 🚀 BioLens Android APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📲 How to Download & Install on Your Phone:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Artifacts** section at the bottom of this Action run page." >> $GITHUB_STEP_SUMMARY
          echo "2. Click on **BioLens-v1.0-debug-apk** to download the zip file." >> $GITHUB_STEP_SUMMARY
          echo "3. Unzip it to get **app-debug.apk**." >> $GITHUB_STEP_SUMMARY
          echo "4. Transfer/Send it to your phone (via USB, Google Drive, WhatsApp, or Telegram)." >> $GITHUB_STEP_SUMMARY
          echo "5. Tap the APK file on your Android phone and select **Install**." >> $GITHUB_STEP_SUMMARY
          echo "6. Open BioLens app. If needed, tap **Server API** in the sidebar to point to your live backend server!" >> $GITHUB_STEP_SUMMARY
